<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>义务教育教科书 日语 九年级 全一册 - 第 44 页</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --page-w: 521.575;
      --page-h: 737.008;
      --accent: #d32f2f;
      --highlight-bg: #ffe082;
      --highlight-color: #b71c1c;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #efe8d8;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    }
    .app {
      width: 100vw;
      height: 100dvh;
      display: grid;
      place-items: center;
      padding: 0;
      margin: 0;
      overflow: hidden;
      position: relative;
    }
    .nav-bar {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 90;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(255, 255, 255, 0.94);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .nav-bar a {
      text-decoration: none;
      color: #2c3e50;
      font-size: 14px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .nav-bar a:hover:not(.disabled) {
      background: #e2e8f0;
    }
    .nav-bar a.disabled {
      opacity: 0.35;
      pointer-events: none;
    }
    .nav-bar strong {
      font-size: 14px;
      color: #64748b;
      margin: 0 4px;
    }
    .speed-control {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 8px;
      padding-left: 10px;
      border-left: 1px solid #cbd5e1;
      font-size: 13px;
      color: #475569;
    }
    .speed-label {
      font-weight: 600;
      color: #334155;
    }
    .speed-btn {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #1e293b;
      border-radius: 4px;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      line-height: 1;
      padding: 0;
      transition: all 0.15s;
    }
    .speed-btn:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
    }
    #speedSlider {
      width: 65px;
      height: 4px;
      accent-color: #d32f2f;
      cursor: pointer;
    }
    #speedVal {
      font-variant-numeric: tabular-nums;
      font-weight: bold;
      color: #d32f2f;
      min-width: 32px;
    }
    .stage {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 12px;
      overflow: hidden;
    }
    .page-scale {
      position: relative;
      width: min(calc(100vw - 24px), calc((100dvh - 24px) * var(--page-w) / var(--page-h)));
      aspect-ratio: var(--page-w) / var(--page-h);
      background: #fff;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
      border-radius: 4px;
      overflow: hidden;
    }
    .page-native {
      position: absolute;
      left: 0;
      top: 0;
      width: calc(var(--page-w) * 1px);
      height: calc(var(--page-h) * 1px);
      transform-origin: 0 0;
    }
    .bg-img, .text-layer, .overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .bg-img {
      z-index: 1;
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }
    .text-layer {
      z-index: 2;
      pointer-events: none;
    }
    .pdf-char {
      position: absolute;
      display: inline-block;
      white-space: pre;
      line-height: 1;
      transform-origin: left top;
      transition: color 0.15s, background-color 0.15s;
    }
    /* When active (sentence/word clicked) -> Turns RED */
    .pdf-char.active {
      color: var(--accent) !important;
      font-weight: bold;
    }
    /* Word-by-word animation highlight (Punctuation NEVER gets this class!) */
    .pdf-char.word-highlight {
      background: var(--highlight-bg) !important;
      color: var(--highlight-color) !important;
      border-radius: 2px;
      box-shadow: 0 0 4px var(--highlight-bg);
    }
    .overlay {
      z-index: 3;
    }
    .point-hotspot {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .sentence-hit {
      position: absolute;
      background: transparent;
      cursor: pointer;
      pointer-events: all;
      border-radius: 3px;
      z-index: 5;
    }
    .sentence-hit:hover {
      background: rgba(211, 47, 47, 0.08);
    }
    .word-hit {
      position: absolute;
      background: transparent;
      cursor: pointer;
      pointer-events: all;
      border-radius: 2px;
      z-index: 6;
    }
    .word-hit:hover {
      background: rgba(211, 47, 47, 0.18);
      outline: 1px dashed rgba(211, 47, 47, 0.4);
    }
    /* Point-read panel floating overlay */
    aside#pointPanel {
      position: fixed;
      right: 16px;
      top: 16px;
      z-index: 100;
      width: min(380px, calc(100vw - 32px));
      max-height: calc(100dvh - 32px);
      overflow: hidden;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 14px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    aside#pointPanel:not(.open) {
      width: auto;
      max-height: none;
      padding: 0;
      background: transparent;
      border: none;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .panel-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.94);
      color: #1e293b;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.2s;
      user-select: none;
      white-space: nowrap;
    }
    .panel-toggle:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    aside#pointPanel.open #panelToggleBtn {
      display: none;
    }
    aside#pointPanel:not(.open) .panel-toggle-wrapper,
    aside#pointPanel:not(.open) .panel-content {
      display: none;
    }
    .panel-toggle-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px 8px;
      border-bottom: 1px solid #f1f5f9;
    }
    .panel-toggle-title {
      font-size: 16px;
      font-weight: bold;
      color: #1e293b;
      margin: 0;
    }
    .panel-close-btn {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .panel-close-btn:hover {
      background: #e2e8f0;
      color: #1e293b;
    }
    .panel-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 10px 16px;
      border-bottom: 1px solid #e2e8f0;
      background: #fafafa;
    }
    .sidebar-header p {
      margin: 0;
      font-size: 12px;
      color: #64748b;
    }
    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      max-height: calc(100dvh - 150px);
    }
    .point-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .point-item {
      padding: 9px 11px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13.5px;
      line-height: 1.45;
      color: #334155;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      transition: all 0.2s;
    }
    .point-item:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .point-item.active {
      background: #fef2f2;
      border-color: #fca5a5;
      color: #b91c1c;
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.12);
    }
    .badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .badge-sentence {
      background: #fee2e2;
      color: #dc2626;
    }
    .badge-vocab {
      background: #e0f2fe;
      color: #0284c7;
    }
    .audio-badge {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      flex-shrink: 0;
      margin-top: 2px;
      line-height: 1.4;
    }
    .audio-badge.source {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #86efac;
    }
    .audio-badge.synth {
      background: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
    }
    /* Responsive layout for mobile */
    @media (max-width: 768px) {
      .stage {
        padding: 0;
      }
      .page-scale {
        width: min(100vw, calc(100dvh * var(--page-w) / var(--page-h)));
        box-shadow: none;
        border-radius: 0;
      }
      .nav-bar {
        top: 8px;
        left: 8px;
        padding: 4px 8px;
        gap: 4px;
      }
      .nav-bar a {
        padding: 3px 6px;
        font-size: 12px;
      }
      .nav-bar strong {
        font-size: 12px;
        margin: 0 2px;
      }
      .speed-control {
        margin-left: 4px;
        padding-left: 6px;
        gap: 3px;
      }
      .speed-label, #speedSlider {
        display: none;
      }
      .speed-btn {
        width: 20px;
        height: 20px;
        font-size: 12px;
      }
      #speedVal {
        font-size: 12px;
        min-width: 26px;
      }
      aside#pointPanel {
        right: 8px;
        top: 8px;
        width: calc(100vw - 16px);
        max-height: calc(100dvh - 16px);
      }
      aside#pointPanel:not(.open) {
        right: 8px;
        top: 8px;
      }
      .panel-toggle {
        padding: 6px 12px;
        font-size: 12px;
      }
      .sidebar-content {
        max-height: calc(100dvh - 130px);
      }
    }
  </style>
</head>

    <aside id="pointPanel">
      <button class="panel-toggle" id="panelToggleBtn" type="button" aria-expanded="false" aria-controls="pointPanelContent">点读列表</button>
      <div class="panel-toggle-wrapper">
        <h2 class="panel-toggle-title">点读列表</h2>
        <button type="button" class="panel-close-btn" id="panelCloseBtn">✕ 关闭</button>
      </div>
      <div id="pointPanelContent" class="panel-content">
        <div class="sidebar-header">
          <p style="margin-bottom:6px;">单击读整句（逐词高亮）；双击单词单独发音。</p>
          <div style="font-size:12px;display:flex;align-items:center;gap:6px;color:#475569;">
            <span class="audio-badge source">原声</span>教材原声切片
            <span class="audio-badge synth" style="margin-left:6px;">合成</span>AI语音合成
          </div>
        </div>
        <div class="sidebar-content">
          <ul class="point-list">
            
          </ul>
        </div>
      </div>
    </aside>
  </div>

  <script>
    const hotspots = [];
    const pageScale = document.querySelector('.page-scale');
    const pageNative = document.querySelector('#pageNative');
    
    // Panel Toggle Logic
    const pointPanel = document.querySelector('#pointPanel');
    const panelToggleBtn = document.querySelector('#panelToggleBtn');
    const panelCloseBtn = document.querySelector('#panelCloseBtn');

    function togglePanel(open) {
      const shouldOpen = open !== undefined ? open : !pointPanel.classList.contains('open');
      pointPanel.classList.toggle('open', shouldOpen);
      panelToggleBtn.setAttribute('aria-expanded', String(shouldOpen));
    }

    panelToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePanel(true);
    });

    panelCloseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePanel(false);
    });

    document.addEventListener('pointerdown', (e) => {
      if (pointPanel.classList.contains('open') && !pointPanel.contains(e.target)) {
        togglePanel(false);
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && pointPanel.classList.contains('open')) {
        togglePanel(false);
      }
    });

    // Audio Player & Speed State
    const audioPlayer = new Audio();
    let currentSpeed = 1.0;
    let activeAnimationTimeout = null;
    let wordClickTimer = null;
    let lastClickedKey = null;

    // Speed Control Elements
    const speedSlider = document.getElementById('speedSlider');
    const speedVal = document.getElementById('speedVal');
    const speedDec = document.getElementById('speedDec');
    const speedInc = document.getElementById('speedInc');

    function updateSpeed(newSpeed) {
      currentSpeed = Math.round(Math.min(2.0, Math.max(0.5, newSpeed)) * 10) / 10;
      speedSlider.value = currentSpeed.toFixed(1);
      speedVal.textContent = currentSpeed.toFixed(1) + 'x';
      audioPlayer.playbackRate = currentSpeed;
    }

    speedSlider.addEventListener('input', (e) => updateSpeed(parseFloat(e.target.value)));
    speedDec.addEventListener('click', () => updateSpeed(currentSpeed - 0.1));
    speedInc.addEventListener('click', () => updateSpeed(currentSpeed + 0.1));

    function resizeScale() {
      const scale = pageScale.clientWidth / 521.575;
      pageNative.style.transform = `scale(${scale})`;
    }
    if ('ResizeObserver' in window) {
      new ResizeObserver(() => resizeScale()).observe(pageScale);
    } else {
      window.addEventListener('resize', resizeScale);
    }
    window.addEventListener('orientationchange', resizeScale);
    resizeScale();

    let wordStopTimer = null;
    let activeSyncSentenceId = null;

    function clearHighlights() {
      activeSyncSentenceId = null;
      if (activeAnimationTimeout) {
        cancelAnimationFrame(activeAnimationTimeout);
        clearTimeout(activeAnimationTimeout);
        activeAnimationTimeout = null;
      }
      if (wordStopTimer) {
        clearTimeout(wordStopTimer);
        wordStopTimer = null;
      }
      document.querySelectorAll('.pdf-char.active').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.pdf-char.word-highlight').forEach(el => el.classList.remove('word-highlight'));
      document.querySelectorAll('.point-item.active').forEach(el => el.classList.remove('active'));
    }

    function stopAudio() {
      if (wordStopTimer) {
        clearTimeout(wordStopTimer);
        wordStopTimer = null;
      }
      try {
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
      } catch (e) {}
    }

    audioPlayer.addEventListener('ended', () => {
      if (activeAnimationTimeout) {
        cancelAnimationFrame(activeAnimationTimeout);
        clearTimeout(activeAnimationTimeout);
        activeAnimationTimeout = null;
      }
      if (wordStopTimer) {
        clearTimeout(wordStopTimer);
        wordStopTimer = null;
      }
      document.querySelectorAll('.pdf-char.word-highlight').forEach(el => el.classList.remove('word-highlight'));
    });

    audioPlayer.addEventListener('pause', () => {
      if (activeAnimationTimeout) {
        cancelAnimationFrame(activeAnimationTimeout);
        clearTimeout(activeAnimationTimeout);
        activeAnimationTimeout = null;
      }
      if (wordStopTimer) {
        clearTimeout(wordStopTimer);
        wordStopTimer = null;
      }
      document.querySelectorAll('.pdf-char.word-highlight').forEach(el => el.classList.remove('word-highlight'));
    });

    // Play entire sentence
    function triggerSentence(hid) {
      const hotspot = hotspots.find(h => h.id === hid);
      if (!hotspot) return;

      clearHighlights();
      stopAudio();
      activeSyncSentenceId = hid;

      // Highlight in sidebar
      const listItem = document.querySelector(`.point-item[data-id="${hid}"]`);
      if (listItem) {
        listItem.classList.add('active');
        listItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      // Turn whole sentence red (including punctuation)
      hotspot.char_ids.forEach(cid => {
        const el = document.getElementById(cid);
        if (el) el.classList.add('active');
      });

      // Play sentence audio at current speed
      if (hotspot.audioSrc) {
        audioPlayer.src = hotspot.audioSrc;
        audioPlayer.playbackRate = currentSpeed;
        audioPlayer.play().catch(e => console.log('Audio playback error:', e));
      }

      // Real-time audio-aligned word highlight (EXCLUDING punctuation!)
      const validWords = (hotspot.words || []).filter(w => !w.is_punct && w.char_ids && w.char_ids.length > 0);
      if (validWords.length > 0) {
        let currentActiveWord = null;

        function syncLoop() {
          if (activeSyncSentenceId !== hid || !audioPlayer) return;
          if (audioPlayer.ended) {
            document.querySelectorAll('.pdf-char.word-highlight').forEach(el => el.classList.remove('word-highlight'));
            return;
          }

          if (!audioPlayer.paused && audioPlayer.currentTime >= 0) {
            const t = audioPlayer.currentTime;
            let currentWord = null;
            for (const w of validWords) {
              if (w.start !== undefined && w.end !== undefined) {
                if (t >= w.start && t < w.end) {
                  currentWord = w;
                  break;
                }
              }
            }

            if (currentActiveWord !== currentWord) {
              currentActiveWord = currentWord;
              document.querySelectorAll('.pdf-char.word-highlight').forEach(el => el.classList.remove('word-highlight'));
              if (currentWord && currentWord.char_ids) {
                currentWord.char_ids.forEach(cid => {
                  const el = document.getElementById(cid);
                  if (el) el.classList.add('word-highlight');
                });
              }
            }
          }

          if (activeSyncSentenceId === hid && !audioPlayer.ended) {
            activeAnimationTimeout = requestAnimationFrame(syncLoop);
          }
        }

        activeAnimationTimeout = requestAnimationFrame(syncLoop);
      }
    }

    // Play word alone (on double-click) - Prioritize authentic native speaker recording
    function triggerWordOnly(hid, widx) {
      const hotspot = hotspots.find(h => h.id === hid);
      if (!hotspot || !hotspot.words || !hotspot.words[widx]) return;
      const word = hotspot.words[widx];

      clearHighlights();
      stopAudio();

      // Highlight in sidebar
      const listItem = document.querySelector(`.point-item[data-id="${hid}"]`);
      if (listItem) {
        listItem.classList.add('active');
      }

      // Turn ONLY this word red and give it word-highlight
      if (word.char_ids) {
        word.char_ids.forEach(cid => {
          const el = document.getElementById(cid);
          if (el) {
            el.classList.add('active');
            el.classList.add('word-highlight');
          }
        });
      }

      // If parent sentence has authentic original audio and word has exact timestamps:
      // Play directly from parent authentic recording range [word.start, word.end]
      if (hotspot.audioType === 'source' && hotspot.audioSrc && word.start !== undefined && word.end !== undefined) {
        audioPlayer.src = hotspot.audioSrc;
        audioPlayer.playbackRate = currentSpeed;
        const st = Math.max(0, word.start - 0.02);
        const et = word.end + 0.04;
        const durMs = Math.max(220, ((et - st) / currentSpeed) * 1000);

        audioPlayer.currentTime = st;
        audioPlayer.play().catch(e => console.log('Audio playback error:', e));

        if (wordStopTimer) clearTimeout(wordStopTimer);
        wordStopTimer = setTimeout(() => {
          audioPlayer.pause();
          wordStopTimer = null;
        }, durMs);
      } else if (word.audioSrc) {
        audioPlayer.src = word.audioSrc;
        audioPlayer.playbackRate = currentSpeed;
        audioPlayer.play().catch(e => console.log('Audio playback error:', e));
      }
    }

    // Word hit events: single click -> sentence (260ms delay), double click -> single word
    document.querySelectorAll('.word-hit').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const hid = el.dataset.hid;
        const widx = parseInt(el.dataset.widx, 10);
        const key = `${hid}_${widx}`;

        if (wordClickTimer && lastClickedKey === key) {
          // Double click detected!
          clearTimeout(wordClickTimer);
          wordClickTimer = null;
          lastClickedKey = null;
          triggerWordOnly(hid, widx);
        } else {
          if (wordClickTimer) clearTimeout(wordClickTimer);
          lastClickedKey = key;
          wordClickTimer = setTimeout(() => {
            wordClickTimer = null;
            lastClickedKey = null;
            triggerSentence(hid);
          }, 260);
        }
      });
    });

    // Sentence hit events (clicks on sentence padding / background) -> trigger immediately
    document.querySelectorAll('.sentence-hit').forEach(el => {
      el.addEventListener('click', (e) => {
        if (wordClickTimer) {
          clearTimeout(wordClickTimer);
          wordClickTimer = null;
        }
        const hotspotDiv = e.target.closest('.point-hotspot');
        if (hotspotDiv) {
          triggerSentence(hotspotDiv.dataset.id);
        }
      });
    });

    // Sidebar list item clicks -> trigger immediately
    document.querySelectorAll('.point-item').forEach(item => {
      item.addEventListener('click', (e) => {
        if (wordClickTimer) {
          clearTimeout(wordClickTimer);
          wordClickTimer = null;
        }
        triggerSentence(item.dataset.id);
      });
    });
  </script>
